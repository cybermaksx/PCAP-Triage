[pytest]
testpaths = tests

# Custom markers must be declared here or pytest warns about typos in
# @pytest.mark.<name>. Which is the point: a misspelled marker silently
# does nothing otherwise.
markers =
    slow: needs synscan.pcapng - 131 428 packets, ~45 s just to parse

# Run the fast tests with:   python -m pytest -m "not slow"
# Run everything with:       python -m pytest
